<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Log in - Motion</title>
    <link rel="icon" href="/favicon.svg" type="image/svg+xml" />
    <link rel="stylesheet" href="/styles.css" />
  </head>
  <body>
    <header class="topbar">
      <div class="brand">
        <div class="brand-mark" aria-hidden="true">
          <svg viewBox="0 0 32 32" fill="none">
            <rect x="3" y="7" width="26" height="18" rx="3" stroke="currentColor" stroke-width="1.6" />
            <path d="M12 12.5v7l6-3.5-6-3.5Z" fill="currentColor" />
          </svg>
        </div>
        <div class="brand-copy">
          <a href="/landing.html" style="text-decoration: none; color: inherit;"><span class="brand-name">MOTION</span></a>
        </div>
      </div>
      <div class="topbar-actions">
        <a class="btn btn-ghost" href="/register.html">Sign up</a>
      </div>
    </header>
    <main class="app" style="grid-template-columns: 1fr;">
      <section class="workspace" style="margin: 0 auto; max-width: 480px; width: 100%;">
        <div class="workspace-content" style="display: block;">
          <header class="workspace-head">
            <h1>Log in</h1>
            <p>Access your Motion workspace</p>
          </header>
          <div class="panel" style="padding: 24px;">
            <form id="loginForm" novalidate>
              <div style="margin-bottom: 12px;">
                <label for="email">Email</label><br/>
                <input id="email" name="email" type="email" required style="width: 100%; padding: 8px;" />
              </div>
              <div style="margin-bottom: 12px;">
                <label for="password">Password</label><br/>
                <input id="password" name="password" type="password" required style="width: 100%; padding: 8px;" />
              </div>
              <div id="error" style="color: var(--danger); margin-bottom: 12px;"></div>
              <button class="btn btn-choose" type="submit">Log in</button>
              <p style="margin-top: 12px;"><a href="/register.html">Create an account</a> · <a href="/reset-request.html">Forgot password?</a></p>
            </form>
          </div>
        </div>
      </section>
    </main>
    <script src="/auth.js"></script>
  </body>
</html>
