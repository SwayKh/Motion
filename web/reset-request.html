<!doctype html>
<html lang="en" data-theme="dark">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Reset password - Motion</title>
    <link rel="icon" href="/favicon.svg" type="image/svg+xml" />
    <link rel="stylesheet" href="/styles.css" />
    <script>(function(){try{const s=localStorage.getItem('motion:theme');const d=window.matchMedia&&window.matchMedia('(prefers-color-scheme: dark)').matches;document.documentElement.dataset.theme=s==='light'?'light':s==='dark'?'dark':d?'dark':'light';}catch(e){}})();</script>
  </head>
  <body>
    <header class="topbar">
      <div class="brand"><div class="brand-mark" aria-hidden="true"><svg viewBox="0 0 32 32" fill="none"><rect x="3" y="7" width="26" height="18" rx="3" stroke="currentColor" stroke-width="1.6" /><path d="M12 12.5v7l6-3.5-6-3.5Z" fill="currentColor" /></svg></div><div class="brand-copy"><span class="brand-name">MOTION</span></div></div>
      <div class="topbar-actions"><a class="btn btn-ghost" href="/login.html">Log in</a></div>
    </header>
    <main>
      <div class="form-card">
        <h1>Reset password</h1>
        <form id="resetReqForm" novalidate>
          <div class="form-group"><label for="email">Email</label><input class="form-input" id="email" name="email" type="email" autocomplete="email" required /></div>
          <div class="form-error" id="error"></div>
          <div class="form-actions"><button class="btn-primary" type="submit">Send reset link</button></div>
        </form>
        <div class="auth-links"><a href="/login.html">Back to login</a></div>
      </div>
    </main>
    <script src="/auth.js"></script>
  </body>
</html>
