services:
  motion:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: motion
    restart: unless-stopped
    # No host port is published: another service already owns host :8080.
    # Caddy reaches Motion as http://motion:8080 over the shared `homelab`
    # network and terminates TLS for the public hostname (e.g. motion.swkh.com).
    expose:
      - "8080"
    env_file:
      - .env
    environment:
      - PORT=${PORT:-8080}
    volumes:
      - motion_data:/app/data
      - motion_uploads:/app/uploads
      - motion_outputs:/app/outputs
    networks:
      - homelab
    healthcheck:
      test: ["CMD", "wget", "--no-verbose", "--tries=1", "--spider", "http://localhost:8080/health"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 30s

volumes:
  motion_data:
  motion_uploads:
  motion_outputs:

networks:
  homelab:
    external: true
